<div class="portal-page">
  <header class="page-header">
    <div>
      <span class="eyebrow">Modul pregătit pentru integrare</span>
      <h1>{{ title }}</h1>
      <p>{{ description }}</p>
    </div>
  </header>

  <section class="placeholder-card">
    <div class="placeholder-icon" aria-hidden="true">{{ icon }}</div>
    <span class="status-badge">Interfață disponibilă</span>
    <h2>Structura vizuală este pregătită</h2>
    <p>{{ missingData }}</p>
    <div class="integration-note">
      <strong>Integrarea cu date reale nu a fost simulată.</strong>
      <span>Modulul va fi conectat după confirmarea endpoint-urilor și a structurii de date din backend.</span>
    </div>
  </section>
</div>
