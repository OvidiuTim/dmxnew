<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  [ngSwitch]="name"
>
  <ng-container *ngSwitchCase="'dashboard'">
    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
    <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
  </ng-container>
  <ng-container *ngSwitchCase="'clock'">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  </ng-container>
  <ng-container *ngSwitchCase="'chart'">
    <path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>
  </ng-container>
  <ng-container *ngSwitchCase="'badge'">
    <rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="9" r="2.5"/><path d="M8 16c1-2 7-2 8 0"/>
  </ng-container>
  <ng-container *ngSwitchCase="'team'">
    <circle cx="9" cy="8" r="3"/><circle cx="18" cy="9" r="2"/><path d="M3 20c0-4 2.5-6 6-6s6 2 6 6M15 15c3-.5 5 1.2 5 4"/>
  </ng-container>
  <ng-container *ngSwitchCase="'calendar'">
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
  </ng-container>
  <ng-container *ngSwitchCase="'warehouse'">
    <path d="m3 10 9-6 9 6v10H3Z"/><path d="M7 20v-6h10v6M3 10h18"/>
  </ng-container>
  <ng-container *ngSwitchCase="'tool'">
    <path d="M14.7 6.3a4 4 0 0 0-5-5L12 3.6 8.4 7.2 6.1 4.9a4 4 0 0 0 5 5L4 17l3 3 7.1-7.1a4 4 0 0 0 5-5L16.8 10 13.2 6.4Z"/>
  </ng-container>
  <ng-container *ngSwitchCase="'shield'">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>
  </ng-container>
  <ng-container *ngSwitchCase="'history'">
    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>
  </ng-container>
  <ng-container *ngSwitchCase="'document'">
    <path d="M6 2h8l4 4v16H6Z"/><path d="M14 2v5h5M9 13h6M9 17h6M9 9h2"/>
  </ng-container>
  <ng-container *ngSwitchCase="'logout'">
    <path d="M10 17l5-5-5-5M15 12H3M14 3h6v18h-6"/>
  </ng-container>
  <ng-container *ngSwitchCase="'search'">
    <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
  </ng-container>
  <ng-container *ngSwitchCase="'package'">
    <path d="m21 8-9 5-9-5 9-5 9 5Z"/><path d="m3 8 9 5 9-5v9l-9 5-9-5Z"/><path d="M12 13v9"/>
  </ng-container>
  <ng-container *ngSwitchCase="'user-check'">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/>
  </ng-container>
  <ng-container *ngSwitchCase="'alert'">
    <path d="M10.3 2.9 1.8 17a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 2.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>
  </ng-container>
  <ng-container *ngSwitchCase="'arrow-up'">
    <path d="m7 17 10-10M7 7h10v10"/>
  </ng-container>
  <ng-container *ngSwitchCase="'arrow-down'">
    <path d="m7 7 10 10M7 17h10V7"/>
  </ng-container>
  <ng-container *ngSwitchCase="'adjust'">
    <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>
  </ng-container>
  <ng-container *ngSwitchCase="'list'">
    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
  </ng-container>
  <ng-container *ngSwitchDefault><circle cx="12" cy="12" r="9"/></ng-container>
</svg>
