    <button class="shelf" *ngFor="let shelf of [1,2,3,4,5,6]"><span class="shelf-icon">▤</span><div><strong>Raftul {{ shelf }}</strong><small>Zonă de depozitare</small></div><i>→</i></button>
  </section>
  <div class="integration-note"><span>i</span><p><strong>Interfață pregătită.</strong> Acțiunile pentru conținutul rafturilor nu sunt conectate deoarece proiectul nu definește un endpoint sau un model frontend pentru rafturi.</p></div>
</div>
