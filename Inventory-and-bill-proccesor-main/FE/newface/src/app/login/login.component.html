<div class="login-wrap">
  <h2>Autentificare</h2>

  <div class="login-tabs" role="tablist" aria-label="Tip autentificare">
    <button
      type="button"
      class="tab-btn"
      role="tab"
      aria-label="Angajați · PIN"
      [attr.aria-selected]="mode === 'account'"
      [class.active]="mode === 'account'"
      (click)="setMode('account')"
    >
      <span>Angajați · PIN</span>
    </button>
    <button
      type="button"
      class="tab-btn"
      role="tab"
      aria-label="Administrator · Parola generală"
      [attr.aria-selected]="mode === 'default'"
      [class.active]="mode === 'default'"
      (click)="setMode('default')"
    >
      <span>Administrator</span>
    </button>
  </div>

  <p class="muted" *ngIf="mode === 'account'">Introdu PIN-ul tău de angajat pentru Team Management.</p>
  <p class="muted" *ngIf="mode === 'default'">Introdu parola generală pentru acces de administrator.</p>

  <form (ngSubmit)="submit()" *ngIf="mode === 'account'" class="login-form account-form">
    <input type="password" [(ngModel)]="pin" name="pin" placeholder="PIN angajat" aria-label="PIN angajat" inputmode="numeric" autocomplete="current-password" />
    <button type="submit" [disabled]="loading || !pin.trim()">Intră în cont</button>
  </form>

  <form (ngSubmit)="submit()" *ngIf="mode === 'default'" class="login-form general-form">
    <input type="password" [(ngModel)]="password" name="password" placeholder="Parolă generală" autocomplete="current-password" />
    <button type="submit" [disabled]="loading || !password">Intră</button>
  </form>

  <div class="error" *ngIf="error">{{ error }}</div>
</div>
