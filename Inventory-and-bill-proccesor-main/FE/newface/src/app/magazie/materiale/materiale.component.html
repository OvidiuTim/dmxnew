<body>
    <section class="sidebar">
        <h1 (click)="seeMagazie()">Magazie</h1>
        <div class="pages">
            <h5 (click)="seeAngajati()">Angajați</h5>
            <h5 class="page-on" (click)="seeMateriale()">Materiale</h5>
            <h5 (click)="seeUnelte()">Unelte</h5>
            <h5 (click)="seeSchela()">schela</h5>
            <h5 (click)="seeIstoric()">Istoric</h5>
        </div>
    </section>

    <section class="pages-content">
        <div class="searchbox">
            <span class="material-symbols-rounded search-icon" aria-hidden="true">search</span>
            <input type="text" placeholder="căutare">
            <button type="button" class="btn btn-success btnAdd" data-toggle="modal" data-target="#addAngajatModal"
                data-backdrop="static" data-keyboard="false"><span class="material-symbols-rounded" aria-hidden="true">add_circle</span>
                Adauga Materiale
            </button>
            <button type="button" class="btnDesc btn btn-primary btnAdd"><span class="material-symbols-rounded" aria-hidden="true">download</span>Descarcă Materiale</button>
        </div>

        

        <div class="table">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Nume echipament</th>
                        <th>Serie</th>
                        <th>Cantitate</th>
                        <th>Actiune</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let dataItem of ToolList">
                        <td>{{dataItem.MaterialName}}</td>
                        <td>{{dataItem.TypeOfUnityOfMesurment}}</td>
                        <td>{{dataItem.Quantity}}</td>
                        <td>
<!-- 

                            <button type="button" class="btn btn-primary iconbtn" style="margin: 3px;"
                                data-toggle="modal" data-target="#GiveToUser"><span class="material-symbols-rounded" aria-hidden="true">edit</span>
                                editati
                            </button>
-->
                            <button type="button" class="btn btn-danger iconbtn" style="margin: 3px;"
                                data-toggle="modal" data-target="#GiveToUser" (click)="deleteClick(dataItem)"><span class="material-symbols-rounded" aria-hidden="true">delete</span>
                                sterge
                            </button>
                        </td>
                </tbody>
            </table>
        </div>

    </section>

    <!-- Modal Adauga Materiale -->
    <div class="modal fade" id="addAngajatModal" tabindex="-1" role="dialog" aria-labelledby="modaladdAngajatModal"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modaladdAngajatModal"><span class="material-symbols-rounded" aria-hidden="true">inventory_2</span>Adauga Material nou</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span class="material-symbols-rounded" aria-hidden="true">close</span>
                    </button>
                </div>
                <div class="modal-body">
                    <label for="">Nume material</label>
                    <input type="text" [(ngModel)]="MaterialName" placeholder="Nume materialului">
                    <label for="">U.M.</label>
                    <input [(ngModel)]="TypeOfUnityOfMesurment"  type="text" placeholder="Introduceti U.M.">
                    <label for="">Cantitate</label>
                    <input [(ngModel)]="Quantity"  type="text" placeholder="0">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Închide</button>
                    <button type="button" class="btn btn-primary" (click)="addUser()" >Salvează</button>
                </div>
            </div>
        </div>
    </div>
</body>
